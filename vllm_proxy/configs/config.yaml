# vLLM Proxy 配置文件
# 所有模型均使用 AWQ 量化
# 详细说明请参考 docs/CONFIGURATION.md

#==============================================================================
# GPU 配置
#==============================================================================
gpu:
  # 使用的 GPU ID
  gpu_id: 0

  # 预留显存缓冲 (MB)
  # 作用1：参与「全局路径」下 --gpu-memory-utilization 的计算
  #        实际利用率 = (总显存 - reserved) × memory_utilization / 总显存
  # 作用2：LRU 淘汰判断中的安全边际（can_fit_model / calculate_eviction_plan）
  # 注意：若模型配置了模型级别 gpu_memory_utilization，则绕过此计算（直接使用模型级值）
  # T4 实测：CUDA context + PyTorch 基础开销约 800MB，2048 提供足够安全边际
  reserved_memory_mb: 1024

  # vLLM 显存利用率 (0.0 - 1.0)
  # 仅对未配置模型级别 gpu_memory_utilization 的模型生效（如 qwen3-4b、qwen2.5-7b 等）
  # 实际传给 vLLM 的值 = (总显存 - reserved_memory_mb) × memory_utilization / 总显存
  # T4 示例：(15360 - 2048) × 0.95 / 15360 ≈ 0.822（约 12.6 GiB）
  memory_utilization: 0.95

#==============================================================================
# 代理服务配置
#==============================================================================
proxy:
  # 监听地址
  host: "127.0.0.1"

  # 代理服务端口
  port: 11436

  # vLLM 进程起始端口
  # 每个模型会占用一个端口，从 base_port 开始递增
  base_port: 8000

  # 空闲超时时间 (秒)
  # 模型空闲超过此时间后自动卸载
  idle_timeout_seconds: 300

  # 健康检查间隔 (秒)
  health_check_interval: 10

  # 启动失败最大重试次数
  max_start_retries: 3

  # 模型启动超时时间 (秒)
  start_timeout_seconds: 600

  # 模型停止超时时间 (秒)
  stop_timeout_seconds: 30

  # API Key 认证配置（可选，与 vLLM/OpenAI 兼容格式）
  # 配置后所有请求都需要在 Header 中提供: Authorization: Bearer <api_key>
  # api_key: "your-secret-api-key"

#==============================================================================
# 日志配置
#==============================================================================
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 日志文件路径 (相对于项目根目录)
  file: "logs/vllm_proxy.log"

  # 单个日志文件最大大小 (字节)
  max_bytes: 10485760  # 10MB

  # 保留的日志文件数量
  backup_count: 5

#==============================================================================
# 模型配置（所有模型使用 AWQ 量化）
# AWQ 量化模型需要：
#   1. quantization: "awq"
#   2. enforce_eager: true（部分模型需要）
#   3. precision: "fp16" 或 "bf16"
#==============================================================================
models:

  #--------------------------------------------------------------------------
  # Qwen3.5-9B-AWQ（QuantTrio 量化版本，标准 AWQ 格式）
  #--------------------------------------------------------------------------
  qwen3.5-9b-awq:
    model_path: "QuantTrio/Qwen3.5-9B-AWQ"
    param_count: 9
    precision: "fp16"
    quantization: "awq_marlin"  # 使用 Marlin kernel，比 awq 更快
    tensor_parallel: 1
    max_model_len: 131072  # 128k 上下文，实际受 KV cache 显存限制
    max_num_seqs: 12
    enforce_eager: true  # T4 GPU SM 不足，torch.compile 负优化，使用 eager 模式
    num_layers: 32
    hidden_size: 4096
    num_attention_heads: 16
    num_kv_heads: 4
    explicit_memory_mb: 7000
    gpu_memory_utilization: 0.86  # embedding 实占 1.40 GiB，空闲 ~13.07 GiB，前置检查余量 ~179 MB
                                  # 0.86×15360=13210 MB≈12.90 GiB；权重 11.2 GiB，KV cache ~1.70 GiB
    extra_args:
      - "--trust-remote-code"
      # 启用工具调用支持
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      # 限制图像最大像素数为 ~1MP（896×1120），平衡图像质量与启动速度
      - "--mm-processor-kwargs"
      - '{"max_pixels": 1003520}'
      # encoder cache budget = max_num_batched_tokens
      # 1024: KV cache 更充裕，适合显存紧张场景
      # 4096: prefill 批次更大，长 prompt 首 token 延迟更低
      # 当前选择 1024：最大化 KV cache 空间
      - "--max-num-batched-tokens"
      - "1024"
      # 关闭 thinking 模式
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      # 启用前缀缓存，对有相同前缀的请求（如 system prompt）可复用 KV cache
      - "--enable-prefix-caching"
      # 跳过 encoder cache profiling，缩短启动时间
      # 风险：encoder 显存不经 profiling 预分配，首次图像推理若超出预留可能 OOM
      - "--skip-mm-profiling"
      # 限制每个 prompt 最多 1 张图（与 max_pixels 限制匹配）
      - "--limit-mm-per-prompt"
      - '{"image": 1}'

  #--------------------------------------------------------------------------
  # Qwen3.5-9B-AWQ-4BIT（CYANKIWI 量化版本，compressed-tensors 格式）
  #--------------------------------------------------------------------------
  qwen3.5-9b-awq-4bit:
    model_path: "CYANKIWI/QWEN3.5-9B-AWQ-4BIT"
    param_count: 9
    precision: "fp16"
    quantization: "compressed-tensors"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 16
    enforce_eager: false  # compressed-tensors 格式，torch.compile + cudagraph 有正收益
    num_layers: 32
    hidden_size: 4096
    num_attention_heads: 16
    num_kv_heads: 4
    explicit_memory_mb: 7000
    extra_args:
      - "--trust-remote-code"
      # 启用工具调用支持
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--mm-processor-kwargs"
      - '{"max_pixels": 1003520}'
      - "--max-num-batched-tokens"
      - "1024"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      # 启用前缀缓存，对有相同前缀的请求（如 system prompt）可复用 KV cache
      - "--enable-prefix-caching"
      # cudagraph_mode=0：禁用 CUDA Graph（避免显存 OOM），保留 torch.compile 优化
      - "--compilation-config"
      - '{"cudagraph_mode": 0}'

  #--------------------------------------------------------------------------
  # Qwen3.5-4B-AWQ（QuantTrio 量化版本，轻量级模型）
  #--------------------------------------------------------------------------
  qwen3.5-4b-awq:
    model_path: "QuantTrio/Qwen3.5-4B-AWQ"
    fla_use_default_norm: true  # Qwen3.5 混合 FLA 架构
    fla_fix_block_size: true
    param_count: 4
    precision: "fp16"
    quantization: "awq_marlin"  # 使用 Marlin kernel，比 awq 更快
    tensor_parallel: 1
    max_model_len: 262144  # 256k 上下文，KV cache 充裕
    max_num_seqs: 16
    enforce_eager: true  # T4 GPU SM 不足，torch.compile 负优化
    explicit_memory_mb: 10000  # max_model_len 增大后需提高预估显存
    extra_args:
      - "--trust-remote-code"
      # 启用工具调用支持
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      # encoder cache budget = max_num_batched_tokens
      # 4096: prefill 批次更大，长 prompt 首 token 延迟更低
      # 4b 显存充裕，KV cache 不受 encoder budget 限制
      - "--max-num-batched-tokens"
      - "4096"
      # 限制图像最大像素数为 ~1MP（896×1120），平衡图像质量与启动速度
      - "--mm-processor-kwargs"
      - '{"max_pixels": 1003520}'
      # 关闭 thinking 模式
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      - "--enable-prefix-caching"
      # 限制每个 prompt 最多 1 张图（明确上限，与 max_pixels 匹配）
      - "--limit-mm-per-prompt"
      - '{"image": 4}'

  #--------------------------------------------------------------------------
  # Qwen3-4B-AWQ（轻量级模型）
  #--------------------------------------------------------------------------
  qwen3-4b-awq:
    model_path: "Qwen/Qwen3-4B-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 3
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 16384
    max_num_seqs: 16
    enforce_eager: true  # T4: enforce_eager=false 会触发 torch.compile 负优化（7.4 t/s vs 45 t/s）
    num_layers: 36
    hidden_size: 2048
    num_attention_heads: 16
    num_kv_heads: 8
    explicit_memory_mb: 4000
    extra_args:
      - "--trust-remote-code"
      - "--enable-prefix-caching"

  #--------------------------------------------------------------------------
  # Qwen3-14B-AWQ
  #--------------------------------------------------------------------------
  qwen3-14b-awq:
    model_path: "Qwen/Qwen3-14B-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 14
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 12
    enforce_eager: true  # T4: enforce_eager=false 导致严重退化（2 t/s vs 16.5 t/s）
    num_layers: 40
    hidden_size: 5120
    num_attention_heads: 40
    num_kv_heads: 8
    explicit_memory_mb: 10000
    extra_args:
      - "--trust-remote-code"
      - "--enable-prefix-caching"

  #--------------------------------------------------------------------------
  # Qwen2.5-7B-AWQ
  #--------------------------------------------------------------------------
  qwen2.5-7b-awq:
    model_path: "Qwen/Qwen2.5-7B-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 7
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 16
    enforce_eager: true
    num_layers: 28
    hidden_size: 3584
    num_attention_heads: 28
    num_kv_heads: 4
    explicit_memory_mb: 6000
    extra_args:
      - "--trust-remote-code"

  #--------------------------------------------------------------------------
  # Qwen2.5-14B-AWQ
  #--------------------------------------------------------------------------
  qwen2.5-14b-awq:
    model_path: "Qwen/Qwen2.5-14B-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 14
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 8
    enforce_eager: true
    num_layers: 48
    hidden_size: 5120
    num_attention_heads: 40
    num_kv_heads: 8
    explicit_memory_mb: 10000
    extra_args:
      - "--trust-remote-code"

  #--------------------------------------------------------------------------
  # Qwen2.5-32B-AWQ
  #--------------------------------------------------------------------------
  qwen2.5-32b-awq:
    model_path: "Qwen/Qwen2.5-32B-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 32
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 4
    enforce_eager: true
    num_layers: 64
    hidden_size: 5120
    num_attention_heads: 40
    num_kv_heads: 8
    explicit_memory_mb: 20000
    extra_args:
      - "--trust-remote-code"

  #--------------------------------------------------------------------------
  # Llama-3.1-8B-AWQ
  #--------------------------------------------------------------------------
  llama3.1-8b-awq:
    model_path: "hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 8
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 16
    enforce_eager: false
    num_layers: 32
    hidden_size: 4096
    num_attention_heads: 32
    num_kv_heads: 8
    explicit_memory_mb: 6000

  #--------------------------------------------------------------------------
  # Mistral-7B-AWQ
  #--------------------------------------------------------------------------
  mistral-7b-awq:
    model_path: "TheBloke/Mistral-7B-Instruct-v0.2-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 7
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 16
    enforce_eager: false
    num_layers: 32
    hidden_size: 4096
    num_attention_heads: 32
    num_kv_heads: 8
    explicit_memory_mb: 5000

  #--------------------------------------------------------------------------
  # Yi-1.5-9B-AWQ
  #--------------------------------------------------------------------------
  yi-1.5-9b-awq:
    model_path: "TheBloke/Yi-1.5-9B-Chat-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 9
    precision: "fp16"
    quantization: "awq"
    tensor_parallel: 1
    max_model_len: 8192
    max_num_seqs: 16
    enforce_eager: false
    num_layers: 48
    hidden_size: 4096
    num_attention_heads: 32
    num_kv_heads: 4
    explicit_memory_mb: 7000

  #--------------------------------------------------------------------------
  # Qwen3-Embedding-0.6B-AWQ（轻量级嵌入模型）
  #--------------------------------------------------------------------------
  qwen3-embedding-0.6b-awq:
    model_path: "Forturne/Qwen3-Embedding-0.6B-INT4-AWQ"
    fla_use_default_norm: false  # 标准 Transformer，无 FLA 线性注意力层
    fla_fix_block_size: false
    param_count: 0.6
    precision: "fp16"
    quantization: "compressed-tensors"
    tensor_parallel: 1
    max_model_len: 2048 # 3064
    max_num_seqs: 2  # 嵌入模型不做自回归生成，KV cache 开销低，可提高并发
    enforce_eager: false  # compressed-tensors 格式，torch.compile + cudagraph 有正收益
    num_layers: 28
    hidden_size: 1024
    num_attention_heads: 16
    num_kv_heads: 8
    explicit_memory_mb: 800  # INT4 权重约 522MB，预留 KV cache 余量
    gpu_memory_utilization: 0.06  # max_model_len=3064：权重 0.51 GiB + KV cache ~0.33 GiB = 0.84 GiB
                                  # 0.06×15360=922 MB=0.90 GiB，余量 ~80 MB
    extra_args:
      - "--trust-remote-code"
      - "--runner"
      - "pooling"  # vLLM 0.18+ 嵌入模式：使用 pooling runner 替代已废弃的 --task embedding
      # cudagraph_mode=0：禁用 CUDA Graph（避免显存 OOM），保留 torch.compile 优化
      - "--compilation-config"
      - '{"cudagraph_mode": 0}'

